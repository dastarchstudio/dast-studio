  #dast-pin .dp-err { color: #b3261e; font-size: 13px; min-height: 18px; margin-top: 6px; }
  #dast-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2147482000; display: none;
    align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; background: rgba(255,255,255,0.96);
    color: #1d1a33; border-radius: 16px; padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    font-family: inherit; direction: rtl; font-size: 13px; max-width: calc(100% - 24px); }
  #dast-bar button { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer; background: #4A4193; color: #fff; }
  #dast-bar button:disabled { opacity: .4; cursor: default; }
  #dast-bar #dast-logout-btn { background: #ece9f6; color: #1d1a33; }
  #dast-bar #dast-msg { color: #6b6685; min-width: 60px; }
  #dast-ts { position: fixed; inset: 0; z-index: 2147483100; display: none; align-items: center; justify-content: center;
    background: rgba(20,16,40,0.55); padding: 14px; font-family: inherit; direction: rtl; }
  #dast-ts .dt-card { background: #fff; color: #1d1a33; width: min(620px, 100%); max-height: 88vh; overflow: auto;
    border-radius: 16px; padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  #dast-ts .dt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #dast-ts .dt-head button, #dast-ts .dt-foot button, #dast-ts .dt-row button { border: 0; border-radius: 9px; padding: 7px 12px;
    background: #ece9f6; color: #1d1a33; font: inherit; cursor: pointer; }
  #dast-ts .dt-top { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  #dast-ts select, #dast-ts input { padding: 8px; border-radius: 9px; border: 1px solid #cfc9e6; font: inherit; }
  #dast-ts .dt-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid #eee; }
  #dast-ts .dt-row label { font-size: 13px; display: flex; gap: 4px; align-items: center; }
  #dast-ts .dt-row .dt-save { background: #4A4193; color: #fff; }
  #dast-ts .dt-row .dt-del { background: #f7e1de; color: #8a2a1f; }
  #dast-ts .dt-empty { color: #6b6685; font-size: 13px; padding: 10px 0; }
  #dast-ts .dt-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
  #dast-ts #dast-ts-msg { font-size: 13px; }
  #dast-bar #dast-ts-btn { background: #ece9f6; color: #1d1a33; }
  .dg-fatal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #fff; color: #b3261e; font-family: inherit; z-index: 2147483001; padding: 20px; text-align: center; }
</style>

<body>
    <div id="root"></div>
    
    
  <div id="dast-bar">
  <span id="dast-who" style="font-weight:700;"></span>
  <span id="dast-status"></span>
  <button type="button" id="dast-in-btn" disabled>ثبت ورود</button>
  <button type="button" id="dast-out-btn" disabled>ثبت خروج</button>
  <button type="button" id="dast-ts-btn" style="display:none">ویرایش تایم‌شیت</button>
  <button type="button" id="dast-export-btn">Excel این ماه</button>
  <button type="button" id="dast-logout-btn">خروج</button>
  <span id="dast-msg"></span>
</div>

<div id="dast-ts" style="display:none">
  <div class="dt-card">
    <div class="dt-head"><strong>ویرایش تایم‌شیت</strong><button type="button" id="dast-ts-close">بستن</button></div>
    <div class="dt-top">
      <select id="dast-ts-user"></select>
      <input type="date" id="dast-ts-day">
    </div>
    <div id="dast-ts-rows"></div>
    <div class="dt-foot">
      <button type="button" id="dast-ts-add">+ افزودن ردیف</button>
      <span id="dast-ts-msg"></span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- ثابت‌ها ----------
  var SB = location.origin + '/api/sb';            // همه‌ی ترافیک Supabase از پراکسی همین سایت
  var STATE_KEY = 'dast-erp-v4';                    // کلیدی که خود v5 استفاده می‌کند
  var SESSION_KEY = 'dast-session';
  var INTRO_FLAG = 'dast-in';                       // پرچم v5 برای رد شدن از انیمیشن
  var FINANCE_KEYS = ['clients', 'contracts', 'costs', 'tenders'];   // فقط ادمین‌ها
  var PER_USER_KEYS = ['me', 'prefs'];                                // روی دستگاه، نه در داده‌ی مشترک
  var LIST_KEYS = ['projects', 'tasks', 'clients', 'leads', 'contracts', 'costs', 'tenders',
    'announcements', 'officeTasks', 'events', 'attendance', 'materials', 'touches', 'times',
    'log', 'files', 'proposals'];
  var HIDE_FOR_STAFF = ['صورت حساب', 'صورت‌حساب', 'قرارداد', 'مناقصه', 'مسابقه', 'کارفرما',
    'تیم مالی', 'هزینه و درآمد', 'درآمد و هزینه', 'گزارش مدیریتی', 'گزارش مدیریت',
    'پروژه جدید', 'افزودن پروژه', 'ایجاد پروژه'];
  var PALETTE = ['#342D73', '#6B5B95', '#4F7FA0', '#2E7D6B', '#A0522D', '#8B3A62', '#4A4193', '#5C6B2E', '#7A4E2D'];

  var origSetItem = Storage.prototype.setItem;
  var saveEnabled = false;      // ذخیره‌ی ابری فقط بعد از بارگذاری تازه فعال می‌شود
  var saveTimer = null;
  var staffRows = [];
  var gateShown = false;

  // ---------- ابزارهای عمومی ----------
  function $(id) { return document.getElementById(id); }
  function persianToLatin(s) { return String(s).replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }); }

  function sbPath(path, query) {
    return SB + '?__p=' + encodeURIComponent(path) + (query ? '&' + query : '');
  }
  function readSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
  }
  function writeSession(s) { origSetItem.call(localStorage, SESSION_KEY, JSON.stringify(s)); }
  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(STATE_KEY);
    sessionStorage.removeItem(INTRO_FLAG);
  }

  function sbRequest(path, query, opts) {
    opts = opts || {};
    var headers = { 'content-type': 'application/json' };
    var s = readSession();
    if (s && s.access_token) headers.authorization = 'Bearer ' + s.access_token;
    if (opts.prefer) headers.prefer = opts.prefer;
    return fetch(sbPath(path, query), {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }

  // ---------- کارمندان (از /api/staff) ----------
  function initials(name) {
    var parts = String(name || '').trim().split(/\s+/);
    var a = parts[0] ? parts[0].charAt(0) : '';
    var b = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
    return (a + b).toUpperCase();
  }
  function toTeamMember(p, i) {
    var intern = /کارآموز/.test(p.role_title || '');
    var parts = String(p.full_name || '').trim().split(/\s+/);
    return {
      id: p.id,
      name: p.full_name || '',
      short: parts[parts.length - 1] || p.full_name || '',
      role: p.role_title || '',
      kind: intern ? 'intern' : 'staff',
      admin: !!p.is_admin,
      hue: PALETTE[i % PALETTE.length],
      phone: '',
      contract: p.department || '',
      code: 'DS-' + String(i + 1).padStart(3, '0'),
      ini: initials(p.full_name),
      rate: intern ? 0.25 : 1
    };
  }
  function loadStaff() {
    return fetch('/api/staff', { headers: { accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error('staff'); return r.json(); })
      .then(function (rows) {
        staffRows = Array.isArray(rows) ? rows : [];
        window.__TEAM__ = staffRows.map(toTeamMember);
      });
  }
  function staffById(id) {
    for (var i = 0; i < staffRows.length; i++) if (staffRows[i].id === id) return staffRows[i];
    return null;
  }

  // ---------- نشست ----------
  function refreshSession() {
    var s = readSession();
    if (!s || !s.refresh_token) return Promise.resolve(false);
    return fetch(sbPath('auth/v1/token', 'grant_type=refresh_token'), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function (r) {
      if (!r.ok) return false;
      return r.json().then(function (d) {
        writeSession({
          access_token: d.access_token,
          refresh_token: d.refresh_token,
          expires_at: Date.now() + (d.expires_in || 3600) * 1000,
          user_id: s.user_id,
          is_admin: s.is_admin,
          name: s.name
        });
        return true;
      });
    }).catch(function () { return false; });
  }
  function ensureSession() {
    var s = readSession();
    if (!s) return Promise.resolve(null);
    if (Date.now() < (s.expires_at || 0) - 60000) return Promise.resolve(s);
    return refreshSession().then(function (ok) {
      if (!ok) { return null; }
      return readSession();
    });
  }

  function login(profileId, password) {
    return fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ profile_id: profileId, password: password })
    }).then(function (r) {
      if (r.status === 401) throw new Error('رمز اشتباه است');
      if (!r.ok) throw new Error('ورود انجام نشد. دوباره تلاش کنید.');
      return r.json();
    }).then(function (d) {
      var p = staffById(profileId) || {};
      writeSession({
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Date.now() + (d.expires_in || 3600) * 1000,
        user_id: d.user_id || profileId,
        is_admin: !!p.is_admin,
        name: p.full_name || ''
      });
    });
  }

  // ---------- داده: خواندن و ذخیره از Supabase ----------
  function fetchRow(id) {
    return sbRequest('rest/v1/erp_state', 'id=eq.' + id + '&select=data')
      .then(function (r) {
        if (!r.ok) throw new Error('row_' + id);
        return r.json();
      })
      .then(function (rows) { return rows && rows[0] && rows[0].data ? rows[0].data : {}; });
  }
  function emptyLab() {
    return { v: 1, materials: [], suppliers: [], categories: [], prices: [], boards: [], items: [],
      favorites: [], catalogs: [], files: [], requests: [] };
  }
  function emptyState() {
    var st = {};
    LIST_KEYS.forEach(function (k) { st[k] = []; });
    st.materials = emptyLab();
    st.prefs = { theme: 'light', accent: 'ochre', intro: true };
    st.me = null;
    return st;
  }
  function fixLab(v) {
    return (v && typeof v === 'object' && !Array.isArray(v) && v.v === 1) ? v : emptyLab();
  }
  function hydrate() {
    return ensureSession().then(function (s) {
      if (!s) throw new Error('no_session');
      return fetchRow('main').then(function (main) {
        var finPromise = s.is_admin ? fetchRow('finance') : Promise.resolve({});
        return finPromise.then(function (fin) {
          var state = emptyState();
          Object.keys(main).forEach(function (k) { if (PER_USER_KEYS.indexOf(k) < 0) state[k] = main[k]; });
          Object.keys(fin).forEach(function (k) { state[k] = fin[k]; });
          state.materials = fixLab(state.materials);
          state.lab = fixLab(state.lab || state.materials);
          if (!s.is_admin) FINANCE_KEYS.forEach(function (k) { state[k] = []; });
          state.me = s.user_id;
          origSetItem.call(localStorage, STATE_KEY, JSON.stringify({ v: 4, data: state }));
        });
      });
    });
  }

  function scheduleSave(raw) {
    if (!saveEnabled) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveState(raw); }, 1200);
  }
  function saveState(raw) {
    var parsed;
    try { parsed = JSON.parse(raw).data; } catch (e) { return; }
    ensureSession().then(function (s) {
      if (!s) return;
      var main = {}, fin = {};
      Object.keys(parsed).forEach(function (k) {
        if (PER_USER_KEYS.indexOf(k) >= 0) return;
        if (FINANCE_KEYS.indexOf(k) >= 0) fin[k] = parsed[k];
        else main[k] = parsed[k];
      });
      var now = new Date().toISOString();
      return upsertRow('main', main, now, s.user_id).then(function () {
        if (s.is_admin) return upsertRow('finance', fin, now, s.user_id);
      });
    }).catch(function (e) { console.warn('ذخیره انجام نشد', e); });
  }
  function upsertRow(id, data, now, uid) {
    return sbRequest('rest/v1/erp_state', 'on_conflict=id', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates,return=minimal',
      body: [{ id: id, data: data, updated_at: now, updated_by: uid }]
    }).then(function (r) { if (!r.ok) throw new Error('save_' + id + '_' + r.status); });
  }

  // نگه داشتن ذخیره‌ی v5 در localStorage و فرستادنش به Supabase
  Storage.prototype.setItem = function (key, value) {
    origSetItem.call(this, key, value);
    if (this === localStorage && key === STATE_KEY) scheduleSave(value);
  };

  // ---------- حضور و غیاب و Excel (همان جدول و API نسخه‌ی قدیمی) ----------
  function openAttendance() {
    return ensureSession().then(function (s) {
      if (!s) return null;
      return sbRequest('rest/v1/attendance',
        'user_id=eq.' + s.user_id + '&check_out=is.null&select=id,check_in&order=check_in.desc&limit=1')
        .then(function (r) { return r.json(); })
        .then(function (rows) { return rows && rows[0] ? rows[0] : null; });
    });
  }
  function checkIn() {
    return ensureSession().then(function (s) {
      return sbRequest('rest/v1/attendance', '', {
        method: 'POST', prefer: 'return=minimal',
        body: { user_id: s.user_id, check_in: new Date().toISOString() }
      });
    }).then(function (r) { if (!r.ok) throw new Error('ثبت ورود انجام نشد'); });
  }
  function checkOut() {
    return ensureSession().then(function (s) {
      return sbRequest('rest/v1/attendance',
        'user_id=eq.' + s.user_id + '&check_out=is.null', {
          method: 'PATCH', prefer: 'return=minimal',
          body: { check_out: new Date().toISOString() }
        });
    }).then(function (r) { if (!r.ok) throw new Error('ثبت خروج انجام نشد'); });
  }
  function exportMonth() {
    var parts = new Intl.DateTimeFormat('en-u-ca-persian', { year: 'numeric', month: 'numeric' }).formatToParts(new Date());
    var jy = '', jm = '';
    parts.forEach(function (p) { if (p.type === 'year') jy = persianToLatin(p.value); if (p.type === 'month') jm = persianToLatin(p.value); });
    return ensureSession().then(function (s) {
      if (!s) throw new Error('نشست فعال نیست');
      return fetch('/api/export-timesheet?jy=' + jy + '&jm=' + jm, {
        headers: { authorization: 'Bearer ' + s.access_token }
      });
    }).then(function (r) {
      if (!r.ok) throw new Error('دریافت فایل انجام نشد');
      return r.blob();
    }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'timesheet-' + jy + '-' + jm + '.xlsx';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
  }

  function renderBar(session) {
    var bar = $('dast-bar');
    if (!bar || !session) return;
    bar.style.display = 'flex';
    wireTimesheetAdmin(session);
    $('dast-who').textContent = session.name || '';
    openAttendance().then(function (open) {
      $('dast-status').textContent = open ? 'وضعیت: در حال کار' : 'وضعیت: خارج از کار';
      $('dast-in-btn').disabled = !!open;
      $('dast-out-btn').disabled = !open;
    }).catch(function () { $('dast-status').textContent = 'وضعیت نامشخص'; });
  }
  function barMessage(text) {
    var el = $('dast-msg'); if (el) el.textContent = text;
  }
  function barAction(fn, okText) {
    barMessage('');
    fn().then(function () { barMessage(okText); return ensureSession().then(renderBar); })
      .catch(function (e) { barMessage(e.message || 'خطا'); });
  }

  // ---------- ورود از روی کارت‌های خود v5 (بدون پاپ‌آپ) ----------
  var pickerActive = false;
  var pinEl = null;

  function staffInText(text) {
    var found = [];
    for (var i = 0; i < staffRows.length; i++) {
      if (text.indexOf(staffRows[i].full_name) >= 0) found.push(staffRows[i]);
    }
    return found;
  }
  // نزدیک‌ترین بالاترین عنصری که دقیقاً یک کارمند را در خودش دارد = کارت آن کارمند
  function findCardFor(target) {
    var el = target;
    while (el && el !== document.body) {
      var txt = (el.innerText || '').trim();
      if (txt && txt.length < 300) {
        var hits = staffInText(txt);
        if (hits.length === 1) return { el: el, person: hits[0] };
      }
      el = el.parentElement;
    }
    return null;
  }
  function closePin() {
    if (pinEl) { pinEl.remove(); pinEl = null; }
  }
  function openPin(card, person) {
    closePin();
    var rect = card.getBoundingClientRect();
    var box = document.createElement('div');
    box.id = 'dast-pin';
    var width = Math.max(rect.width, 260);
    box.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 8)) + 'px';
    box.style.top = Math.min(rect.bottom + 8, window.innerHeight - 170) + 'px';
    box.style.width = width + 'px';
    box.innerHTML =
      '<div class="dp-name"></div>' +
      '<input type="password" class="dp-pass" autocomplete="current-password" placeholder="رمز عبور">' +
      '<div class="dp-btns"><button type="button" class="dp-ok">ورود</button><button type="button" class="dp-cancel">انصراف</button></div>' +
      '<div class="dp-err"></div>';
    box.querySelector('.dp-name').textContent = person.full_name || '';
    var input = box.querySelector('.dp-pass');
    var ok = box.querySelector('.dp-ok');
    var err = box.querySelector('.dp-err');
    function submit() {
      var pass = input.value;
      if (!pass) { err.textContent = 'رمز را وارد کنید'; return; }
      err.textContent = '';
      ok.disabled = true;
      login(person.id, pass).then(function () {
        sessionStorage.setItem(INTRO_FLAG, '1');
        return hydrate().catch(function () { /* کش محلی */ });
      }).then(function () { location.reload(); })
        .catch(function (e) { err.textContent = e.message || 'خطا'; ok.disabled = false; });
    }
    ok.onclick = submit;
    box.querySelector('.dp-cancel').onclick = closePin;
    input.onkeydown = function (e) { if (e.key === 'Enter') submit(); if (e.key === 'Escape') closePin(); };
    document.body.appendChild(box);
    pinEl = box;
    input.focus();
  }

  function onPickerClick(e) {
    if (!pickerActive) return;
    if (e.target && e.target.closest && e.target.closest('#dast-pin,#dast-bar')) return;
    var found = findCardFor(e.target);
    if (!found) { closePin(); return; }
    // جلوگیری از اجرای کلیک خود v5 (که بدون رمز وارد می‌کرد)
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    openPin(found.el, found.person);
  }
  function armPicker() {
    if (pickerActive) return;
    pickerActive = true;
    window.addEventListener('click', onPickerClick, true);
  }

  // ---------- محدود کردن نمایش برای غیرادمین (روی متن بخش‌ها) ----------
  var hideTimer = null;
  function applyStaffRules(session) {
    if (!session || session.is_admin) return;
    function run() {
      var els = document.querySelectorAll('button,a,[role=button],li,h1,h2,h3,p,span,div');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.closest && el.closest('#dast-bar,#dast-gate')) continue;
        var txt = (el.textContent || '').trim();
        if (!txt || txt.length > 60) continue;
        for (var k = 0; k < HIDE_FOR_STAFF.length; k++) {
          if (txt.indexOf(HIDE_FOR_STAFF[k]) >= 0) {
            var box = el.closest('button,a,li,[role=button],section,article') || el;
            box.style.display = 'none';
            break;
          }
        }
      }
    }
    run();
    var obs = new MutationObserver(function () {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(run, 300);
    });
    obs.observe(document.body, { childList: true, subtree: true });
  }

  // ---------- انتظار برای صفحه‌ی «کی پشت میزه؟» (بعد از انیمیشن v5) ----------
  function watchPicker(onReady) {
    var done = false;
    var t = setInterval(function () {
      if (done) return;
      if (document.body && document.body.innerText && document.body.innerText.indexOf('کی پشت میزه') >= 0) {
        done = true;
        clearInterval(t);
        onReady();
      }
    }, 300);
    setTimeout(function () { if (!done) clearInterval(t); }, 60000);
  }

  function onPickerVisible() {
    ensureSession().then(function (s) {
      if (!s) { armPicker(); return; }
      sessionStorage.setItem(INTRO_FLAG, '1');
      return hydrate().then(function () { location.reload(); }, function () { armPicker(); });
    });
  }

  function injectBundle() {
    var s = document.createElement('script');
    s.src = 'v5-app.js';
    document.body.appendChild(s);
  }

  // ---------- شروع ----------
  function boot() {
    loadStaff().then(function () {
      var postLogin = sessionStorage.getItem(INTRO_FLAG) === '1';
      if (postLogin) {
        return ensureSession().then(function (s) {
          if (!s) {
            sessionStorage.removeItem(INTRO_FLAG);
            return startIntro();
          }
          return hydrate().then(function () {
            saveEnabled = true;
          }, function () { /* کش محلی */ }).then(function () {
            injectBundle();
            renderBar(s);
            applyStaffRules(s);
          });
        });
      }
      return startIntro();
    }).catch(function () {
      document.body.insertAdjacentHTML('beforeend', '<div class="dg-fatal">لیست کارمندان در دسترس نیست. صفحه را دوباره باز کنید.</div>');
    });
  }

  function startIntro() {
    injectBundle();
    watchPicker(function () {
      onPickerVisible();
    });
  }


  // ---------- ویرایش دستی تایم‌شیت (فقط ادمین) ----------
  var TEHRAN = '+03:30';
  function tehranHM(iso) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tehran', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));
  }
  function tehranDayRange(day) {
    var start = new Date(day + 'T00:00:00' + TEHRAN);
    var end = new Date(start.getTime() + 24 * 3600 * 1000);
    return { start: start.toISOString(), end: end.toISOString() };
  }
  function isoAt(day, hm) {
    if (!/^\d{2}:\d{2}$/.test(hm || '')) return null;
    return new Date(day + 'T' + hm + ':00' + TEHRAN).toISOString();
  }
  function openTimesheetAdmin() {
    var m = $('dast-ts');
    m.style.display = 'flex';
    var sel = $('dast-ts-user');
    if (!sel.options.length) {
      staffRows.forEach(function (p) {
        var o = document.createElement('option');
        o.value = p.id; o.textContent = p.full_name || '';
        sel.appendChild(o);
      });
    }
    if (!$('dast-ts-day').value) {
      var d = new Date(); var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      $('dast-ts-day').value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    loadTimesheetDay();
  }
  function closeTimesheetAdmin() { $('dast-ts').style.display = 'none'; }
  function tsMsg(t, bad) { var el = $('dast-ts-msg'); el.textContent = t || ''; el.style.color = bad ? '#b3261e' : '#4A4193'; }
  function loadTimesheetDay() {
    var uid = $('dast-ts-user').value, day = $('dast-ts-day').value;
    var list = $('dast-ts-rows');
    list.innerHTML = '';
    if (!uid || !day) return;
    var r = tehranDayRange(day);
    ensureSession().then(function () {
      return sbRequest('rest/v1/attendance',
        'user_id=eq.' + uid + '&check_in=gte.' + encodeURIComponent(r.start) + '&check_in=lt.' + encodeURIComponent(r.end) + '&select=id,check_in,check_out&order=check_in.asc');
    }).then(function (res) { return res.json(); }).then(function (rows) {
      if (!Array.isArray(rows)) { tsMsg('خواندن ردیف‌ها انجام نشد', true); return; }
      if (!rows.length) list.innerHTML = '<div class="dt-empty">برای این روز ردیفی نیست.</div>';
      rows.forEach(function (row) { list.appendChild(tsRow(row.id, row.check_in, row.check_out)); });
      tsMsg('');
    }).catch(function () { tsMsg('خطا در خواندن', true); });
  }
  function tsRow(id, inIso, outIso) {
    var box = document.createElement('div');
    box.className = 'dt-row';
    box.innerHTML = '<label>ورود <input type="time" class="dt-in"></label>' +
      '<label>خروج <input type="time" class="dt-out"></label>' +
      '<button type="button" class="dt-save">ذخیره</button>' +
      '<button type="button" class="dt-del">حذف</button>';
    box.querySelector('.dt-in').value = inIso ? tehranHM(inIso) : '';
    box.querySelector('.dt-out').value = outIso ? tehranHM(outIso) : '';
    box.querySelector('.dt-save').onclick = function () { saveTsRow(box, id); };
    box.querySelector('.dt-del').onclick = function () {
      if (!id) { box.remove(); return; }
      if (!confirm('این ردیف حذف شود؟')) return;
      sbRequest('rest/v1/attendance', 'id=eq.' + id, { method: 'DELETE', prefer: 'return=minimal' })
        .then(function (r) { if (!r.ok) throw new Error(); tsMsg('حذف شد'); loadTimesheetDay(); })
        .catch(function () { tsMsg('حذف انجام نشد', true); });
    };
    return box;
  }
  function saveTsRow(box, id) {
    var day = $('dast-ts-day').value, uid = $('dast-ts-user').value;
    var inV = box.querySelector('.dt-in').value, outV = box.querySelector('.dt-out').value;
    var cin = isoAt(day, inV), cout = outV ? isoAt(day, outV) : null;
    if (!cin) { tsMsg('ساعت ورود را وارد کن', true); return; }
    if (cout && cout <= cin) { tsMsg('ساعت خروج باید بعد از ورود باشد', true); return; }
    var req = id
      ? sbRequest('rest/v1/attendance', 'id=eq.' + id, { method: 'PATCH', prefer: 'return=minimal', body: { check_in: cin, check_out: cout } })
      : sbRequest('rest/v1/attendance', '', { method: 'POST', prefer: 'return=minimal', body: { user_id: uid, check_in: cin, check_out: cout } });
    req.then(function (r) {
      if (!r.ok) throw new Error('save');
      tsMsg('ذخیره شد');
      loadTimesheetDay();
    }).catch(function () { tsMsg('ذخیره انجام نشد. دسترسی یا ساعت‌ها را بررسی کن.', true); });
  }
  function addTsRow() {
    var list = $('dast-ts-rows');
    if (list.querySelector('.dt-empty')) list.innerHTML = '';
    list.appendChild(tsRow(null, null, null));
  }
  function wireTimesheetAdmin(session) {
    if (!session || !session.is_admin) return;
    var btn = $('dast-ts-btn');
    btn.style.display = '';
    btn.onclick = openTimesheetAdmin;
    $('dast-ts-user').onchange = loadTimesheetDay;
    $('dast-ts-day').onchange = loadTimesheetDay;
    $('dast-ts-add').onclick = addTsRow;
    $('dast-ts-close').onclick = closeTimesheetAdmin;
  }

  // ---------- دکمه‌های نوار پایین ----------
  function wireUi() {
    $('dast-in-btn').onclick = function () { barAction(checkIn, 'ورود ثبت شد'); };
    $('dast-out-btn').onclick = function () { barAction(checkOut, 'خروج ثبت شد'); };
    $('dast-export-btn').onclick = function () {
      barMessage('در حال دریافت...');
      exportMonth().then(function () { barMessage(''); }).catch(function (e) { barMessage(e.message || 'خطا'); });
    };
    $('dast-logout-btn').onclick = function () { clearSession(); location.reload(); };
  }

  // پاک‌سازی سرویس‌ورکر و کش نسخه‌ی قدیمی، تا کاربر نسخه‌ی قبلی سایت را نبیند
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
  }
  if (window.caches) {
    caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
  }

  // دکمه‌ی خروج داخل خود v5 (کنار نام کاربر) هم باید واقعاً از حساب خارج کند
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!t || (t.closest && t.closest('#dast-bar,#dast-pin,#dast-ts'))) return;
    if (t.getAttribute('aria-label') === 'خروج' || t.getAttribute('title') === 'تعویض کاربر') {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      clearSession();
      location.reload();
    }
  }, true);

  wireUi();
  boot();
})();

</script>
</body>
</html>
